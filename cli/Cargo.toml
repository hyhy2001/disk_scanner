[package]
name = "duscan"
version = "0.1.0"
edition = "2021"

[dependencies]
check-disk-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
chrono = "0.4"
ctrlc = "3.4"
mimalloc = "0.1"
